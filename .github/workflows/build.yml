name: Build iOS IPA (RoboVM)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build iOS Native App with RoboVM
        run: |
          ./gradlew :ios:createIPA || true
          echo "=== Contents of ios/build ==="
          find ios/build -maxdepth 4 || true
          mkdir -p ios/build/Payload
          find ios/build -name "*.app" -exec cp -r {} ios/build/Payload/ \; || true
          chmod -R +x ios/build/Payload/
          cd ios/build
          zip -r Avatar2D-Client-LiveContainer.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-IPA
          path: |
            ios/build/Avatar2D-Client-LiveContainer.ipa
            ios/build/robovm/*.ipa
            ios/build/robovm/*.app
