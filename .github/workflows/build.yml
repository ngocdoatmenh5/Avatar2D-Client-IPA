name: Build Multiplatform (Desktop, Android, iOS)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-desktop-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Desktop JAR & Android APK Debug
        run: ./gradlew :lwjgl3:jar :android:assembleDebug

      - name: Upload Desktop JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-JAR
          path: lwjgl3/build/libs/*.jar

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Debug
          path: android/build/outputs/apk/debug/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build iOS App & Pack Bundle
        run: |
          ./gradlew :ios:build
          mkdir -p ios/build/Payload
          find ios/build -name "*.app" -exec cp -r {} ios/build/Payload/ \; || true
          cd ios/build && zip -r Avatar2D-iOS-IPA.ipa Payload || true
          cd ios/build && zip -r Avatar2D-iOS-Build.zip robovm/ || true

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-Bundle
          path: |
            ios/build/Avatar2D-iOS-IPA.ipa
            ios/build/Avatar2D-iOS-Build.zip
